<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property manager | True Value Realty</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body class="admin-body"><header class="site-header"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/images/logo.png" alt="True Value Realty"><span class="brand-copy"><strong>TRUE <em>VALUE</em></strong><small>ADMIN</small></span></a><button id="logout-button" class="button button-outline">Sign out</button></header><main class="section admin-main"><div class="admin-heading"><div><p class="eyebrow">PROPERTY MANAGEMENT</p><h1>Your <em>listings.</em></h1><p class="muted">Only publish information and photos you are authorised to use.</p></div></div><div class="admin-layout"><form id="property-form" class="lead-form admin-form"><input type="hidden" name="id"><h2 id="editor-title">Add a property</h2><label>Property title *<input name="title" required maxlength="120"></label><div class="form-two"><label>Category *<select name="category" required><option value="Apartment">Apartment / flat</option><option value="Plot">Plot / land</option><option value="Villa">Villa / house</option><option value="Commercial">Commercial</option></select></label><label>Listing type *<select name="listingType"><option>Sale</option><option>Rent</option><option>Lease</option></select></label></div><div class="form-two"><label>Price (INR) *<input name="price" type="number" min="0" step="1" required></label><label>Area value<input name="areaValue" type="number" min="0" step="any"></label></div><div class="form-two"><label>Area unit<select name="areaUnit"><option>sq ft</option><option>sq m</option><option>acre</option><option>guntha</option></select></label><label>Bedrooms (if applicable)<input name="bedrooms" type="number" min="0" max="50"></label></div><label>Locality / address *<input name="location" required maxlength="200"></label><label>Description *<textarea name="description" required rows="4" maxlength="3000"></textarea></label><label>Image URL (one per line)<textarea name="images" rows="3" placeholder="https://..."></textarea></label><label>Listing source *<select name="ownershipType"><option value="Owned">Owned / represented by our business</option><option value="Third-party">Third-party listing (authorised)</option></select></label><label>Approved contact phone (optional)<input name="contactPhone" inputmode="tel"></label><label>Publication status<select name="status"><option value="draft">Draft</option><option value="published">Published</option><option value="sold">Sold</option><option value="rented">Rented</option><option value="archived">Archived</option></select></label><label class="check-label"><input name="authorised" type="checkbox"> I confirm that the listing details and photos are accurate and authorised for publication.</label><div class="form-actions"><button class="button button-gold" type="submit">Save property</button><button id="reset-form" class="button button-outline" type="button">Clear</button></div><p id="admin-message" class="form-message" role="status"></p></form><section class="admin-list"><div class="list-header"><h2>Property catalogue</h2><button id="refresh-list" class="button button-outline" type="button">Refresh</button></div><div id="admin-properties"><p class="muted">Loading catalogue…</p></div></section></div></main><script type="module" src="../assets/js/admin.js"></script></body></html>
